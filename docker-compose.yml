services:
  postgres:
    image: postgres:16
    container_name: bookings-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookings
      POSTGRES_USER: bookings_user
      POSTGRES_PASSWORD: bookings_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: